name: Network Demo Preview

on:
  push:
    branches:
      - network-demo-preview
    paths:
      - 'preview/network-demo.html'
      - '.github/workflows/network-demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: network-demo-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: network-demo-preview
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare standalone preview
        run: |
          mkdir -p _site
          cp preview/network-demo.html _site/index.html
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
