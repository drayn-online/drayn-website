name: DRAYN Website Production

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - 'favicon.svg'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'CNAME'
      - 'preview/**'
      - '.github/workflows/network-demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: drayn-website-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir -p _site/preview
          cp ./*.html _site/
          cp favicon.svg _site/favicon.svg
          cp robots.txt _site/robots.txt
          cp sitemap.xml _site/sitemap.xml
          cp CNAME _site/CNAME
          cp -R preview/. _site/preview/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
